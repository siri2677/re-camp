name: Unity Tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-preflight:
    name: Fresh checkout preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Unity project baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f ProjectSettings/ProjectVersion.txt
          test -f ProjectSettings/ProjectSettings.asset
          test -f Packages/manifest.json
          test -f Assets/_ReCamp/Scripts/ReCamp.Runtime.asmdef
          grep -q "m_EditorVersion: 6000.5.3f1" ProjectSettings/ProjectVersion.txt
          grep -q "defaultScreenOrientation: 4" ProjectSettings/ProjectSettings.asset
          grep -q "allowedAutorotateToPortrait: 0" ProjectSettings/ProjectSettings.asset
          grep -q "allowedAutorotateToPortraitUpsideDown: 0" ProjectSettings/ProjectSettings.asset
          grep -q "allowedAutorotateToLandscapeRight: 1" ProjectSettings/ProjectSettings.asset
          grep -q "allowedAutorotateToLandscapeLeft: 1" ProjectSettings/ProjectSettings.asset

  editmode-playmode:
    name: EditMode and PlayMode
    needs: repository-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity license configuration
        id: license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [[ -n "${UNITY_LICENSE}" || -n "${UNITY_SERIAL}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unity tests
        if: steps.license.outputs.available == 'true'
        id: unity-tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.3f1
          testMode: all
          artifactsPath: artifacts

      - name: Report skipped Unity tests
        if: steps.license.outputs.available != 'true'
        run: |
          echo "Unity tests skipped: configure UNITY_LICENSE or UNITY_SERIAL (and account credentials) to enable the runner."

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-artifacts
          path: artifacts
          if-no-files-found: warn
