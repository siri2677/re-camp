name: Current docs consistency

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_project_docs.py"
      - "scripts/validate_gate_b_preflight.py"
      - ".github/workflows/docs-consistency.yml"
  push:
    branches:
      - '**'
    paths:
      - "**/*.md"
      - "scripts/validate_project_docs.py"
      - "scripts/validate_gate_b_preflight.py"
      - ".github/workflows/docs-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Current Generation document ownership
        run: python scripts/validate_project_docs.py

      - name: Validate current roster Gate B preflight package
        run: python scripts/validate_gate_b_preflight.py
