name: Docs consistency

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/validate_project_docs.py"
      - ".github/workflows/docs-consistency.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "scripts/validate_project_docs.py"
      - ".github/workflows/docs-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation ownership and stale guidance
        id: validate_docs
        shell: bash
        run: |
          set +e
          python scripts/validate_project_docs.py 2>&1 | tee docs-validation.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-validation
          path: docs-validation.txt
          if-no-files-found: error
          retention-days: 7
